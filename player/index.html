<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yukinotempe RPG • Menghubungkan ke Server...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #06080e;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        /* Ambient Cyber Glow */
        .ambient-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, rgba(6, 8, 14, 0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: pulse 3s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }
        .gateway-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 20px;
            padding: 32px 28px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #c4b5fd;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 99px;
            margin-bottom: 20px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-top: 3px solid #8b5cf6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }
        p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 18px;
        }
        .meta-target {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #64748b;
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 8px;
            word-break: break-all;
        }
        .action-fallback {
            margin-top: 20px;
            display: none;
        }
        .action-fallback a {
            display: inline-block;
            background: #8b5cf6;
            color: #ffffff;
            font-weight: 600;
            font-size: 12px;
            padding: 8px 18px;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .action-fallback a:hover {
            background: #7c3aed;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="gateway-card">
        <div class="logo-badge">
            <span>⚔️ YUKINOTEMPE RPG</span>
        </div>
        <div class="spinner"></div>
        <h1 id="status-title">Menghubungkan ke Server RPG...</h1>
        <p id="status-desc">Memuat data petualang dari cluster live server. Mohon tunggu sebentar...</p>
        <div class="meta-target" id="target-info">Target: resolving player profile...</div>
        <div class="action-fallback" id="fallback-wrap">
            <a id="fallback-btn" href="#">Klik jika tidak otomatis dialihkan</a>
        </div>
    </div>

    <script>
        // Endpoint server aktif (dapat diubah dengan mudah saat migrasi VM)
        const ACTIVE_BACKEND = "https://3000-agqwrsykco5jy5rhidnm2xqkaa.instabox.tech";

        // Ambil query param 'id'
        const urlParams = new URLSearchParams(window.location.search);
        let playerId = urlParams.get('id');

        // Jika tidak ada di query parameter, periksa apakah ada di path hash atau slug
        if (!playerId) {
            const hash = window.location.hash.replace('#', '').trim();
            if (hash) playerId = hash;
        }

        const targetInfo = document.getElementById('target-info');
        const fallbackWrap = document.getElementById('fallback-wrap');
        const fallbackBtn = document.getElementById('fallback-btn');

        if (playerId) {
            // Bersihkan format (hanya angka)
            const cleanId = playerId.replace(/[^0-9]/g, '');
            const targetUrl = `${ACTIVE_BACKEND}/player/${cleanId}`;
            targetInfo.textContent = `Player ID: ${cleanId}`;
            fallbackBtn.href = targetUrl;
            
            // Seamless instant redirect
            setTimeout(() => {
                window.location.replace(targetUrl);
            }, 300);

            // Tampilkan fallback setelah 2.5 detik jika koneksi lambat
            setTimeout(() => {
                fallbackWrap.style.display = 'block';
            }, 2500);
        } else {
            // Jika ID tidak disertakan, arahkan ke halaman utama / info bot
            document.getElementById('status-title').textContent = "ID Pemain Tidak Ditemukan";
            document.getElementById('status-desc').textContent = "Tautan profil harus menyertakan ID pemain (contoh: ?id=628xxx).";
            targetInfo.textContent = "Silakan ketik !profil di grup WhatsApp untuk mendapatkan link profilmu.";
        }
    </script>
</body>
</html>
